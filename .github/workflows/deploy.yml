name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  PROJECT_ID: vietrochack-lab
  REGION: us-central1
  FUNCTION_NAME: dainingrit-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Workload Identity Federation, no stored key

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy API to Cloud Functions (gen2)
        run: |
          gcloud functions deploy "$FUNCTION_NAME" \
            --gen2 \
            --runtime=python312 \
            --region="$REGION" \
            --source=backend \
            --entry-point=api \
            --trigger-http \
            --allow-unauthenticated \
            --memory=512Mi \
            --timeout=120s \
            --max-instances=3 \
            --set-env-vars=FIRESTORE_DATABASE=dainingrit,IMAGE_BUCKET=vietrochack-lab-dainingrit \
            --set-secrets=GEMINI_API_KEY=dainingrit-gemini-api-key:latest \
            --project="$PROJECT_ID"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Deploy frontend to Firebase Hosting
        run: |
          npx firebase-tools deploy --only hosting:dainingrit \
            --project "$PROJECT_ID" --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}

      - name: Summary
        run: |
          echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- API function: $FUNCTION_NAME ($REGION)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Frontend: https://dainingrit.vietrochack.com" >> "$GITHUB_STEP_SUMMARY"
